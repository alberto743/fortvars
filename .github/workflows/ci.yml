name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install gfortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gfortran

      - name: Install fortvars with test dependencies
        run: python3 -m pip install -e '.[test]'

      - name: Run tests
        run: pytest -v
